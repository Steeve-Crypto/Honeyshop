# Logstash pipeline for Honeyshop JSONL logs
# Place this file in the Logstash pipeline directory or mount it.

input {
  file {
    path => "/var/log/honeyshop/honeyshop.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "honeyshop"
  }
}

filter {
  if [type] == "honeyshop" {
    # Ensure timestamp is proper
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
    }

    # GeoIP enrichment (optional – requires GeoIP database)
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }

    # Normalize fields
    mutate {
      rename => {
        "src_ip"   => "source.ip"
        "src_port" => "source.port"
        "service"  => "honeypot.service"
        "event"    => "honeypot.event"
        "data"     => "honeypot.payload"
      }
      remove_field => ["host", "path", "type"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeyshop-%{+YYYY.MM.dd}"
  }

  # Uncomment for debugging
  # stdout { codec => rubydebug }
}
