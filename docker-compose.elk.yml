# Optional ELK stack for Honeyshop analysis
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.elk.yml up -d --build

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: honeyshop-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=honeyshop
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - honeyshop

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: honeyshop-logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/var/log/honeyshop:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - honeyshop

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: honeyshop-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - honeyshop

volumes:
  es_data:

networks:
  honeyshop:
    driver: bridge
